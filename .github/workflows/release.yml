name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Defaults to v<package.json version>."
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  electron-windows:
    name: Build Windows installer and attach to release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($package.build.buildVersion)" >> $env:GITHUB_OUTPUT

      - name: Build Electron Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:electron-win
